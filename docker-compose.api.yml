# Zhiquan API. Only im-platform runs here.
# start.sh builds 78chat-im-platform:local on the machine. The jar is mounted in.
# MySQL, Redis, MinIO, and im-server stay on the services already running.

name: zhiquan-api

services:
  im-platform:
    image: 78chat-im-platform:local
    pull_policy: never
    container_name: zhiquan-api
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:18889:8888"
    volumes:
      - ./im-platform.jar:/app/app.jar:ro
      # Secrets stay on the machine. Deploys overwrite other files in this directory and leave config/ alone.
      - ./config:/app/config:ro
      - ${CODEX_AUTH_DIR:-/root/snap/codex/34}:/codex-auth
    command:
      - --spring.config.additional-location=file:/app/config/
      - --server.servlet.context-path=/api
      - --spring.profiles.active=prod
      - --spring.task.scheduling.enabled=${SCHEDULING_ENABLED}
      - --im.scheduling.enabled=${SCHEDULING_ENABLED}
      - --spring.datasource.url=${DATASOURCE_URL}
      - --spring.datasource.username=${DATASOURCE_USERNAME}
      - --spring.datasource.password=${ZHQUAN_DB_PASSWORD}
      - --spring.data.redis.host=${REDIS_HOST}
      - --spring.data.redis.port=${REDIS_PORT}
      - --spring.data.redis.password=${ZHQUAN_REDIS_PASSWORD}
      - --spring.data.redis.database=${REDIS_DATABASE}
      - --minio.endpoint=${MINIO_ENDPOINT}
      - --ai-cs.knowledge-base.embedding-url=${EMBEDDING_URL}
      - --sport.account.bound-secret=${SPORT_BOUND_SECRET:-}
      - --ai-cs.knowledge-ingest-bot.admin-user-ids=${KNOWLEDGE_INGEST_ADMIN_USER_IDS}