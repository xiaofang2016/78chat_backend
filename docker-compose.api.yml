# 新版本职圈接口。只跑 im-platform。
# 运行环境用已经在机器上的 78chat-im-platform:local，jar 挂进新容器。
# 不重建这个镜像，也不动 zhiquan-im-platform-1。
# MySQL、Redis、MinIO、im-server 沿用已经在跑的那套。

name: zhiquan-api

services:
  im-platform:
    image: 78chat-im-platform:local
    container_name: zhiquan-api
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:18889:8888"
    volumes:
      - ./im-platform.jar:/app/app.jar:ro
      # 口令配置留在机器上，不进制品。流水线覆盖同目录其他文件时不动 config/。
      - ./config:/app/config:ro
      - ${CODEX_AUTH_DIR:-/root/snap/codex/34}:/codex-auth
    command:
      - --spring.profiles.active=prod
      - --spring.config.additional-location=file:/app/config/
      - --server.servlet.context-path=/api
      - --spring.task.scheduling.enabled=false
      - --im.scheduling.enabled=false
      - --spring.datasource.url=jdbc:mysql://host.docker.internal:13306/im_platform?useSSL=false&useUnicode=true&characterEncoding=utf-8&allowPublicKeyRetrieval=true
      - --spring.datasource.username=root
      - --spring.datasource.password=${ZHQUAN_DB_PASSWORD}
      - --spring.data.redis.host=172.31.4.67
      - --spring.data.redis.port=6379
      - --spring.data.redis.password=${ZHQUAN_REDIS_PASSWORD}
      - --spring.data.redis.database=3
      - --minio.endpoint=http://host.docker.internal:9100
      - --openai.auth-mode=codex-oauth
      - --openai.codex-auth-file=/codex-auth/auth.json
      - --openai.codex-model=gpt-6-luna
      - --ai-cs.knowledge-base.enabled=true
      - --ai-cs.knowledge-base.embedding-url=http://host.docker.internal:8791
      - --ai-cs.knowledge-base.bot-user-ids[0]=9000000004
      - --ai-cs.knowledge-base.bot-user-ids[1]=900001
      - --ai-cs.knowledge-base.bot-user-ids[2]=9000000005
      - --ai-cs.knowledge-base.bot-user-ids[3]=9000000006
      - --ai-cs.knowledge-base.bot-user-ids[4]=9000000007
      - --ai-cs.knowledge-base.bot-user-ids[5]=9000000008
      - --ai-cs.knowledge-base.bot-user-ids[6]=9000000009
      - --ai-cs.knowledge-base.bot-user-ids[7]=9000000010
      - --ai-cs.knowledge-base.bot-user-ids[8]=9000000011
      - --ai-cs.knowledge-base.bot-user-ids[9]=9000000012
      - --sport.account.bound-secret=${SPORT_BOUND_SECRET:-}
      - --ai-cs.knowledge-ingest-bot.admin-user-ids[0]=40
      - --ai-cs.knowledge-ingest-bot.admin-user-ids[1]=52
      - --ai-cs.knowledge-ingest-bot.admin-user-ids[2]=86
      - --ai-cs.knowledge-ingest-bot.admin-user-ids[3]=87
      - --ai-cs.knowledge-ingest-bot.admin-user-ids[4]=88
      - --ai-cs.knowledge-ingest-bot.admin-user-ids[5]=56819
      - --ai-cs.knowledge-ingest-bot.admin-user-ids[6]=57156
      - --ai-cs.knowledge-ingest-bot.admin-user-ids[7]=57157
      - --ai-cs.knowledge-ingest-bot.admin-user-ids[8]=57158
